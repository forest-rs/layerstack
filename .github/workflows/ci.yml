env:
  # We aim to always test with the latest stable Rust toolchain, however we pin to a specific
  # version like 1.70. Note that we only specify MAJOR.MINOR and not PATCH so that bugfixes still
  # come automatically. If the version specified here is no longer the latest stable version,
  # then please feel free to submit a PR that adjusts it along with the potential clippy fixes.
  RUST_STABLE_VER: "1.99" # In quotes because otherwise (e.g.) 1.70 would be interpreted as 1.7
  # The purpose of checking with the minimum supported Rust toolchain is to detect its staleness.
  # If the compilation fails, then the version specified here needs to be bumped up to reality.
  # Be sure to also update the rust-version property in the workspace Cargo.toml file,
  # plus all the README.md files of the affected packages.
  RUST_MIN_VER: "1.89"
  # List of packages that will be checked with the minimum supported Rust version.
  # This should be limited to packages that are intended for publishing.
  RUST_MIN_VER_PKGS: >-
    -p opinionated
    -p layerstack
    -p layerstack_schemas
    -p layerstack_usda
    -p layerstack_usdc
    -p layerstack_usdz
    -p layerstack_io
    -p layerstack_mesh_export
  # List of packages that don't support `no_std`.
  # `layerstack_wasm` is a WebAssembly module; its no_std build is checked
  # by the gate, and a `cdylib` is not a crate type `x86_64-unknown-none`
  # supports.
  RUST_NO_STD_PKGS: >-
    --exclude layerstack_conformance
    --exclude layerstack_examples
    --exclude layerstack_schemagen
    --exclude layerstack_wasm
    --exclude wind_tunnel
  # List of packages that don't support wasip1
  # `layerstack_wasm`'s exports import wasm-bindgen's JavaScript glue, which
  # a WASI runtime does not provide; the `typescript` job runs the module.
  RUST_NO_WASIP1_PKGS: >-
    --exclude layerstack_examples
    --exclude layerstack_schemagen
    --exclude layerstack_wasm
    --exclude wind_tunnel
  # List of packages that don't support wasm32
  RUST_NO_WASM_PKGS: >-
    --exclude layerstack_examples
    --exclude layerstack_schemagen
    --exclude wind_tunnel
  # List of features that depend on the standard library and will be excluded from no_std checks.
  FEATURES_DEPENDING_ON_STD: "std,default"
  # Line tables keep backtraces readable (file and line) and drop the rest
  # of the debug info, which is most of each test binary and of its link.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Rationale
#
# We don't run clippy with --all-targets because then even --lib and --bins are compiled with
# dev dependencies enabled, which does not match how they would be compiled by users.
# A dev dependency might enable a feature that we need for a regular dependency,
# and checking with --all-targets would not find our feature requirements lacking.
# This problem still applies to cargo resolver version 2.
# Thus we split all the targets into two steps, one with --lib --bins
# and another with --tests --benches --examples.
# Also, we can't give --lib --bins explicitly because then cargo will error on binary-only packages.
# Luckily the default behavior of cargo with no explicit targets is the same but without the error.
#
# We use cargo-hack for a similar reason. Cargo's --workspace will do feature unification across
# the whole workspace. While cargo-hack will instead check each workspace package separately.
#
# Using cargo-hack also allows us to more easily test the feature matrix of our packages.
# We use --each-feature & --optional-deps which will run a separate check for every feature.
# The feature matrix runs on Linux only; Windows and macOS run clippy once per package with
# every feature enabled, which catches platform-specific code without repeating the matrix.
#
# We use cargo-nextest, which has a faster concurrency model for running tests.
# However cargo-nextest does not support running doc tests, so we also have a cargo test --doc step.
# For more information see https://github.com/nextest-rs/nextest/issues/16
#
# The MSRV jobs run only cargo check because different clippy versions can disagree on goals and
# running tests introduces dev dependencies which may require a higher MSRV than the bare package.
#
# For no_std checks we target x86_64-unknown-none, because this target doesn't support std
# and as such will error out if our dependency tree accidentally tries to use std.
# https://doc.rust-lang.org/stable/rustc/platform-support/x86_64-unknown-none.html
#
# We don't save caches in the merge-group cases, because those caches will never be re-used (apart
# from the very rare cases where there are multiple PRs in the merge queue).
# This is because GitHub doesn't share caches between merge queues and the main branch.

name: CI

on:
  pull_request:
  merge_group:
  # We run on push, even though the commit is the same as when we ran in merge_group.
  # This allows the cache to be primed.
  # See https://github.com/orgs/community/discussions/66430
  push:
    branches:
      - main

jobs:
  fmt:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: Install Taplo
        uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91 # v2
        with:
          version: "0.10.0"

      - name: Run taplo fmt
        run: taplo fmt --check --diff

      - name: install ripgrep
        run: |
          sudo apt update
          sudo apt install ripgrep

      - name: check copyright headers
        run: bash .github/copyright.sh

      - name: install cargo-rdme
        uses: taiki-e/install-action@v2
        with:
          # 2.x requires a separate pinned nightly for rustdoc JSON.
          # Keep this README check on the stable-only 1.x toolchain path.
          tool: cargo-rdme@1.5.1

      - name: check layerstack README
        run: cargo rdme --workspace-project=layerstack --heading-base-level=0 --check

  packages:
    name: release archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}

      - name: build and verify release archives
        run: cargo package ${{ env.RUST_MIN_VER_PKGS }} -p layerstack_wasm -p layerstack_schemagen --locked --all-features

      - name: check archive metadata and license files
        run: python3 .github/check_packages.py target/package

  clippy-stable:
    name: cargo clippy
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          targets: x86_64-unknown-none
          components: clippy

      - name: install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: cargo clippy (no_std)
        if: matrix.os == 'ubuntu-latest'
        run: cargo hack clippy ${{ env.RUST_NO_STD_PKGS }} --workspace --locked --optional-deps --each-feature --ignore-unknown-features --features libm --exclude-features ${{ env.FEATURES_DEPENDING_ON_STD }} --target x86_64-unknown-none -- -D warnings

      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo hack clippy --workspace --locked --optional-deps --each-feature --ignore-unknown-features --features std -- -D warnings

      - name: cargo clippy (auxiliary)
        if: matrix.os == 'ubuntu-latest'
        run: cargo hack clippy --workspace --locked --optional-deps --each-feature --ignore-unknown-features --features std --tests --benches --examples -- -D warnings

      - name: cargo clippy (all features)
        if: matrix.os != 'ubuntu-latest'
        run: cargo hack clippy --workspace --locked --all-features -- -D warnings

      - name: cargo clippy (auxiliary, all features)
        if: matrix.os != 'ubuntu-latest'
        run: cargo hack clippy --workspace --locked --all-features --tests --benches --examples -- -D warnings

  clippy-stable-wasm:
    name: cargo clippy (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          targets: wasm32-unknown-unknown
          components: clippy

      - name: install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: cargo clippy
        run: cargo hack clippy ${{ env.RUST_NO_WASM_PKGS }} --workspace --locked --target wasm32-unknown-unknown --optional-deps --each-feature --ignore-unknown-features --features std -- -D warnings

      - name: cargo clippy (auxiliary)
        run: cargo hack clippy ${{ env.RUST_NO_WASM_PKGS }} --workspace --locked --target wasm32-unknown-unknown --optional-deps --each-feature --ignore-unknown-features --features std --tests --benches --examples -- -D warnings

  test-stable:
    name: cargo test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install libfontconfig-dev libfreetype-dev

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          # The schema compiler formats the Rust modules it writes with rustfmt.
          components: rustfmt

      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: cargo nextest
        run: cargo nextest run --workspace --locked --all-features --no-fail-fast

      - name: cargo test --doc
        run: cargo test --doc --workspace --locked --all-features --no-fail-fast

      # The examples assert their own results, so run them rather than only build them.
      - name: run examples
        if: runner.os == 'Linux'
        run: |
          for example in asset_resolution explain_value flatten instancing live_editing minimal sparse_array_edits value_clips light_rig_slots timeline typed_schema; do
            cargo run --locked --all-features -p layerstack_examples --example "$example"
          done
          cargo run --locked --all-features -p layerstack_examples --example validate_usda -- \
            core-spec-supplemental-release_dec2025/file_formats/tests/assets/text/usda/geometryattributes.usda core-spec-supplemental-release_dec2025/file_formats/tests/assets/text/usda/simple.usda
          cargo run --locked --all-features -p layerstack_examples --example mesh_to_usdz -- "$RUNNER_TEMP/cube.usdz"
          cargo run --locked --all-features -p layerstack_examples --example mesh_materials_to_usdz -- "$RUNNER_TEMP/materials.usdz"
          cargo run --locked --all-features -p layerstack_examples --example scatter_to_usdz -- "$RUNNER_TEMP/field.usdz"
          cargo run --locked --all-features -p layerstack_examples --bin prepared_reload
          for binary in live_scene material_network procedural_graph; do
            cargo run --locked --all-features -p layerstack_examples --bin "$binary"
          done

  test-stable-wasm:
    name: cargo test (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          targets: wasm32-wasip1,wasm32-unknown-unknown

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: install wasmtime runner
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "latest"

      - name: cargo test (wasip1)
        run: cargo test ${{ env.RUST_NO_WASIP1_PKGS }} --workspace --locked --all-features --target wasm32-wasip1 --no-fail-fast

      - name: cargo test compile (wasm32-unknown-unknown)
        run: cargo test ${{ env.RUST_NO_WASM_PKGS }} --workspace --locked --target wasm32-unknown-unknown --all-features --no-run

  check-msrv:
    name: cargo check (msrv)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: install msrv toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MIN_VER }}
          targets: x86_64-unknown-none

      - name: install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: cargo check (no_std)
        run: cargo hack check ${{ env.RUST_MIN_VER_PKGS }} ${{ env.RUST_NO_STD_PKGS }} --locked --optional-deps --each-feature --ignore-unknown-features --features libm --exclude-features ${{ env.FEATURES_DEPENDING_ON_STD }} --target x86_64-unknown-none

      - name: cargo check
        run: cargo hack check ${{ env.RUST_MIN_VER_PKGS }} --locked --optional-deps --each-feature --ignore-unknown-features --features std

  check-msrv-wasm:
    name: cargo check (msrv) (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install msrv toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MIN_VER }}
          targets: wasm32-unknown-unknown

      - name: install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: cargo check
        run: cargo hack check ${{ env.RUST_MIN_VER_PKGS }} ${{ env.RUST_NO_WASM_PKGS }} --locked --target wasm32-unknown-unknown --optional-deps --each-feature --ignore-unknown-features --features std

  # The `@forest-rs/layerstack` package over the default module: build the
  # module as it ships (the `wasm` profile, the `wasm-bindgen` CLI at the
  # version Cargo.lock holds, `wasm-opt -Oz`), fail over its size budget
  # (packages/layerstack/size-budget.json), type-check the wrapper and its
  # tests, and run the tests in Node.
  typescript:
    name: typescript package
    runs-on: ubuntu-latest
    env:
      BINARYEN_VERSION: "133"
    defaults:
      run:
        working-directory: packages/layerstack
    steps:
      - uses: actions/checkout@v7

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          targets: wasm32-unknown-unknown

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: install the wasm-bindgen CLI at the locked version
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' ../../Cargo.lock)
          name="wasm-bindgen-$version-x86_64-unknown-linux-musl"
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$name.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: install binaryen
        run: |
          name="binaryen-version_$BINARYEN_VERSION"
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/$name-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"

      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            packages/layerstack/package-lock.json
            packages/demo/package-lock.json

      - name: install the package's dev dependencies
        run: npm ci

      - name: build the module
        env:
          LAYERSTACK_REVISION: ${{ github.sha }}
        run: npm run build:wasm

      - name: check the size budget
        run: npm run size

      - name: build and type-check the wrapper
        run: |
          npm run build
          npm run check

      - name: run the Node tests
        run: npm test

      # The demo links the package built above.
      - name: install the demo's dev dependencies
        working-directory: packages/demo
        run: npm ci

      - name: type-check and build the demo
        working-directory: packages/demo
        run: npm run build

      - name: run the demo's script headless
        working-directory: packages/demo
        run: npm run acceptance

  doc:
    name: cargo doc
    # NOTE: We don't have any platform specific docs in this workspace, so we only run on Ubuntu.
    #       If we get per-platform docs (win/macos/linux/wasm32/..) then doc jobs should match that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      # We test documentation using nightly to match docs.rs.
      - name: cargo doc
        run: cargo doc --workspace --locked --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: '--cfg docsrs -D warnings'

  # The tables and views in layerstack_schemas/src/generated, and the test
  # table in layerstack_conformance/tests/generated, must be what
  # layerstack_schemagen writes from the usd-core release they name and the
  # OpenUSD sources of that release (for each property's `apiName`).
  generated-schemas:
    name: generated schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The oracles read crate fixtures, which live in Git LFS.
          lfs: true

      - name: check out OpenUSD's schema sources
        uses: actions/checkout@v7
        with:
          repository: PixarAnimationStudios/OpenUSD
          ref: v26.11.1
          path: openusd
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            cmake/defaults/Version.cmake
            pxr/usd/*/schema.usda
            pxr/usd/*/*.h
            pxr/usd/*/generatedSchema.usda
            pxr/usd/*/plugInfo.json
            pxr/usd/*/userDoc/schemaUserDoc.usda
            pxr/usd/usd/testenv/testUsdGenSchema/**
            pxr/usd/pcp/testenv/testPcpDynamicFileFormatPlugin.testenv/**
            pxr/usd/pcp/testenv/testPcpDynamicFileFormatPlugin.py
            pxr/usd/pcp/testenv/TestPcpDynamicFileFormatPlugin.cpp
            pxr/usd/pcp/testenv/TestPcpDynamicFileFormatPlugin_plugInfo.json
            pxr/usd/sdf/testenv/testSdfParsing.testenv/**

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE_VER }}
          components: rustfmt

      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install usd-core
        run: python -m pip install usd-core==26.11

      - name: restore cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: check generated schemas
        run: |
          pxr="$(python -c 'import os, pxr; print(os.path.dirname(pxr.__file__))')"
          cargo run --locked -p layerstack_schemagen -- --check --pxr "$pxr" --source openusd

      # The schema compiler must write what OpenUSD's usdGenSchema writes:
      # every schema domain's checked-in generatedSchema.usda and
      # plugInfo.json, and testUsdGenSchema's baselines and failures.
      - name: test the schema compiler against OpenUSD
        env:
          LAYERSTACK_OPENUSD_SOURCE: ${{ github.workspace }}/openusd
        run: |
          cargo test --locked -p layerstack_conformance --test conformance schema_compiler::

      # The checked-in Rust module of the observatory fixture must be what the
      # schema compiler generates from OpenUSD's `Xformable` today.
      - name: check generated schema library module
        env:
          LAYERSTACK_OPENUSD_SOURCE: ${{ github.workspace }}/openusd
        run: cargo test --locked -p layerstack_custom_schemas --test generated

      # Every committed OpenUSD oracle must still be what OpenUSD regenerates:
      # `check_oracles.py` runs each `*_oracle.py` that takes `--check`, so a
      # new oracle is checked without a step of its own.
      - name: check OpenUSD oracles
        env:
          LAYERSTACK_OPENUSD_SOURCE: openusd
        run: python layerstack_conformance/scripts/check_oracles.py

      # The dynamic file format port must pass OpenUSD's own test cases on
      # its fixtures.
      - name: test dynamic payloads against OpenUSD's fixtures
        env:
          LAYERSTACK_OPENUSD_SOURCE: ${{ github.workspace }}/openusd
        run: cargo test --locked -p layerstack_io dynamic_payloads

      # The schema views oracle must be what OpenUSD reads from its scene.
      - name: check schema views oracle
        env:
          LAYERSTACK_OPENUSD_SOURCE: openusd
        run: |
          python layerstack_conformance/scripts/schema_views_oracle.py \
            layerstack_conformance/fixtures/schema_views/scene.usda "$RUNNER_TEMP/oracle.json"
          diff -u layerstack_conformance/fixtures/schema_views/oracle.json "$RUNNER_TEMP/oracle.json"

      # The edit target oracle must be how OpenUSD's edit targets map.
      - name: check edit target maps oracle
        run: |
          python layerstack_conformance/scripts/edit_target_maps_oracle.py \
            layerstack_conformance/fixtures/edit_target_maps "$RUNNER_TEMP/edit_target_maps.json"
          diff -u layerstack_conformance/fixtures/edit_target_maps/oracle.json "$RUNNER_TEMP/edit_target_maps.json"

      # The prim field oracle must be what OpenUSD's authoring calls author.
      - name: check prim field edits oracle
        run: |
          python layerstack_conformance/scripts/prim_field_edits_oracle.py \
            layerstack_conformance/fixtures/prim_field_edits "$RUNNER_TEMP/prim_field_edits.json"
          diff -u layerstack_conformance/fixtures/prim_field_edits/oracle.json "$RUNNER_TEMP/prim_field_edits.json"

      # The layer field oracle must be what OpenUSD authors and composes.
      - name: check layer field edits oracle
        run: |
          python layerstack_conformance/scripts/layer_field_edits_oracle.py \
            layerstack_conformance/fixtures/layer_field_edits "$RUNNER_TEMP/layer_field_edits.json"
          diff -u layerstack_conformance/fixtures/layer_field_edits/oracle.json "$RUNNER_TEMP/layer_field_edits.json"

      # The delete oracle must be what OpenUSD's namespace editor does.
      - name: check namespace deletes oracle
        run: |
          python layerstack_conformance/scripts/namespace_deletes_oracle.py \
            layerstack_conformance/fixtures/namespace_deletes "$RUNNER_TEMP/namespace_deletes.json"
          diff -u layerstack_conformance/fixtures/namespace_deletes/oracle.json "$RUNNER_TEMP/namespace_deletes.json"

      # The copy oracle must be what OpenUSD's SdfCopySpec copies.
      - name: check copy spec oracle
        run: |
          python layerstack_conformance/scripts/copy_spec_oracle.py \
            layerstack_conformance/fixtures/copy_spec "$RUNNER_TEMP/copy_spec.json"
          diff -u layerstack_conformance/fixtures/copy_spec/oracle.json "$RUNNER_TEMP/copy_spec.json"

      # These compare with OpenUSD when a Python with `pxr` is given and
      # skip otherwise, as they do in the test jobs: every conformance test
      # that reads `LAYERSTACK_USD_PYTHON`, found by that name so that a new
      # one runs here too (flattening, saves and their round trip through
      # OpenUSD, variant set names, value clips, stage queries and more),
      # with layer saves and prim field edits. Every test runs even when one
      # fails, so a failure shows all that differ from OpenUSD.
      - name: test against OpenUSD
        env:
          LAYERSTACK_USD_PYTHON: python
          # OpenUSD's own USDA parsing corpus (`usda_corpus`).
          LAYERSTACK_OPENUSD_SOURCE: ${{ github.workspace }}/openusd
        run: bash layerstack_conformance/scripts/test_against_openusd.sh

      - name: check runnable tutorial outputs with OpenUSD
        run: |
          for tutorial in tutorial_hello_world tutorial_references tutorial_variants tutorial_stage_io; do
            cargo run --locked -p layerstack_examples --example "$tutorial" -- "$RUNNER_TEMP/tutorials/$tutorial"
          done
          python layerstack_conformance/scripts/tutorials_oracle.py "$RUNNER_TEMP/tutorials"

      - name: check procedural world publication
        run: |
          cargo run --locked -p layerstack_examples --bin procedural_graph -- "$RUNNER_TEMP/procedural-world"
          python layerstack_conformance/scripts/procedural_graph_oracle.py "$RUNNER_TEMP/procedural-world/procedural_world.usda"

