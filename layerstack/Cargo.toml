[package]
name = "layerstack"
description = "AOUSD-aligned, no_std-friendly composition kernel (layer stacks, variants, references, list ops)."
readme = "README.md"
documentation = "https://docs.rs/layerstack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["composition", "layering", "usd", "variants", "no-std"]
categories = ["data-structures"]

[features]
default = []
std = []
# The storage-representation helpers (`doc::get_field`, `property::get_property`,
# ...) and the work pool (`parallel::with_pool`, `Pool`, ...) as public items,
# for this repository's format crates, tests and benchmarks. They follow no
# semver promise.
unstable-internals = []

[lints]
workspace = true

[dependencies]
hashbrown = { workspace = true }
invalidation = { workspace = true }
libm = { workspace = true }
opinionated = { workspace = true }
smallvec = { workspace = true }
# `XID_Start` and `XID_Continue`, which USD identifiers are made of.
unicode-ident = { workspace = true }
