[package]
publish = false
name = "layerstack_conformance"
description = "Conformance harness and golden tests for the layerstack crate."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["composition", "usd", "conformance", "tests"]
categories = ["development-tools::testing"]

[lints]
workspace = true

[dependencies]
layerstack = { workspace = true }
layerstack_mesh_export = { workspace = true }
layerstack_schemas = { features = ["all"], workspace = true }
layerstack_usda = { workspace = true }
layerstack_usdc = { features = ["std"], workspace = true }
layerstack_usdz = { workspace = true }
serde = { features = ["derive"], version = "1.0" }
# `float_roundtrip` parses the bit-exact vectors exactly.
serde_json = { features = ["float_roundtrip"], version = "1.0" }

[build-dependencies]
layerstack_schemagen = { path = "../layerstack_schemagen" }
