[package]
publish = false
name = "layerstack_custom_schemas"
description = "A schema library of its own, as a downstream crate builds one: the lab and observatory fixture schemas as Rust views generated by layerstack_schemagen on layerstack_schemas' public API."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["usd", "schemas", "codegen", "tests"]
categories = ["development-tools::testing"]

[lints]
workspace = true

[dependencies]
layerstack = { workspace = true }
# `observatory` builds on `usdGeom`'s `Xformable`; `lab` on `usd`'s `Typed`.
layerstack_schemas = { features = ["usd-geom"], workspace = true }

[dev-dependencies]
layerstack_usda = { workspace = true }

# The freshness test of the checked-in `observatory` module compiles it again.
# Like the generator itself, it does not build for wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
layerstack_schemagen = { path = "../layerstack_schemagen" }

# The `lab` module is generated at build time, as a downstream build
# script generates its own.
[build-dependencies]
layerstack_schemagen = { path = "../layerstack_schemagen" }
