[package]
name = "layerstack_io"
description = "USDA, USDC and USDZ readers and writers, and explicit stage loading, saving and reload, for Layerstack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/layerstack_io"
keywords = ["usd", "usda", "usdc", "usdz", "scene-description"]
categories = ["encoding", "parser-implementations", "no-std"]

[features]
default = ["std"]
std = ["layerstack/std"]
# The format syntax layers (USDA `lexer`, `cst`, `parser`, `ast`, `lower`,
# `emit`; USDC `header`, `toc`, `section`, `value_rep`, `value_type`,
# `compression`, `assemble`; USDZ `zip`, `crc32`) as public modules, for this
# repository's tests, benchmarks and fuzzing. They follow no semver promise.
unstable-internals = []

[dependencies]
# Hash maps for internal indexes; `layerstack` already depends on it.
hashbrown = { workspace = true }
layerstack = { features = ["unstable-internals"], workspace = true }
# LZ4 block decompression and compression for USDC sections.
lz4_flex = { workspace = true }
# Array-edit instructions over the writers' own value types; `layerstack`
# already depends on it and exposes its types.
opinionated = { workspace = true }
smallvec = { workspace = true }

[lints]
workspace = true
