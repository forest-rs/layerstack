[package]
name = "layerstack_io"
description = "Explicit stage loading, saving and reload orchestration for Layerstack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/layerstack_io"
keywords = ["usd", "scene-description", "io"]
categories = ["encoding", "no-std"]

[features]
default = ["std"]
std = ["layerstack/std", "layerstack_usdc/std", "layerstack_usdz/std"]

[dependencies]
# Hash maps for internal indexes; `layerstack` already depends on it.
hashbrown = { workspace = true }
layerstack = { workspace = true }
layerstack_usda = { workspace = true }
layerstack_usdc = { workspace = true }
layerstack_usdz = { workspace = true }

[dev-dependencies]
# Tests locate package members through the USDZ reader.
layerstack_usdz = { features = ["unstable-internals"], workspace = true }

[lints]
workspace = true
