[package]
name = "layerstack_mesh_export"
description = "Polygon mesh export to USDA/USDC/USDZ (UsdGeomMesh) for layerstack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["usd", "usdz", "mesh", "export", "no-std"]
categories = ["graphics", "encoding"]

[dependencies]
layerstack = { path = "../layerstack" }
layerstack_usda = { path = "../layerstack_usda" }
layerstack_usdc = { path = "../layerstack_usdc" }
layerstack_usdz = { path = "../layerstack_usdz" }
# Square roots for instance transforms in `no_std`; `layerstack` already
# depends on it.
libm = { workspace = true }

[lints]
workspace = true
