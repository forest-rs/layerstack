[package]
name = "layerstack_mesh_export"
description = "Polygon mesh export to USDA/USDC/USDZ (UsdGeomMesh) for layerstack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/layerstack_mesh_export"
keywords = ["usd", "usdz", "mesh", "export", "no-std"]
categories = ["graphics", "encoding"]

[dependencies]
layerstack = { workspace = true }
# The schema, property and token names it authors, so an OpenUSD schema
# change breaks the build rather than the files.
layerstack_schemas = { default-features = false, features = [
    "usd-geom",
    "usd-shade",
], workspace = true }
layerstack_usda = { workspace = true }
layerstack_usdc = { workspace = true }
layerstack_usdz = { workspace = true }
# Square roots for instance transforms in `no_std`; `layerstack` already
# depends on it.
libm = { workspace = true }

[lints]
workspace = true
