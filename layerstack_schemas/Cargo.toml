[package]
name = "layerstack_schemas"
description = "Every schema domain OpenUSD ships (usd, usdGeom, usdShade, usdLux, usdSkel, usdPhysics and more) as layerstack schema definitions, generated from OpenUSD's own definitions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The generated tables derive from OpenUSD's schema definitions, under the
# Tomorrow Open Source Technology License 1.0 (`LICENSE-TOST-1.0`,
# `NOTICE`); the hand-written code is Apache-2.0 OR MIT.
license = "(Apache-2.0 OR MIT) AND LicenseRef-TOST-1.0"
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/layerstack_schemas"
keywords = ["usd", "openusd", "schemas", "scene-description"]
categories = ["graphics"]
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "NOTICE",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "LICENSE-TOST-1.0",
]

# BEGIN GENERATED FEATURES (layerstack_schemagen)
[features]
default = ["all"]
# Every domain.
all = ["usd", "usd-geom", "usd-shade", "usd-lux", "usd-skel", "usd-physics", "usd-vol", "usd-render", "usd-lod", "usd-ui", "usd-ri", "usd-hydra", "usd-media", "usd-proc", "usd-semantics", "usd-profiles", "usd-mtlx"]
usd = []
usd-geom = ["usd"]
usd-shade = ["usd"]
usd-lux = ["usd", "usd-geom", "usd-shade"]
usd-skel = ["usd", "usd-geom"]
usd-physics = ["usd", "usd-geom"]
usd-vol = ["usd-geom"]
usd-render = ["usd", "usd-geom", "usd-shade"]
usd-lod = ["usd"]
usd-ui = ["usd"]
usd-ri = []
usd-hydra = ["usd-render", "usd-proc"]
usd-media = ["usd-geom"]
usd-proc = ["usd-geom"]
usd-semantics = []
usd-profiles = []
usd-mtlx = ["usd-shade"]
# END GENERATED FEATURES

std = ["fearless_simd?/std"]
# Optional CPU skinning acceleration; scalar kernels remain dependency-free.
simd = ["usd-skel", "dep:fearless_simd"]

[dependencies]
layerstack = { workspace = true }
# Sines, cosines, arccosines and square roots for transforms in `no_std`;
# `layerstack` already depends on it.
fearless_simd = { optional = true, workspace = true }
libm = { workspace = true }

[lints]
workspace = true
