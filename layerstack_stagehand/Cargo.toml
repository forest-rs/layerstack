[package]
name = "layerstack_stagehand"
description = "Render-ready buffers from a composed Layerstack stage: triangulated meshes, face-varying primvars, normals, subset draw ranges and tessellated implicit shapes."
version.workspace = true
edition.workspace = true
# `exedra_triangulate` needs Rust 1.92, above the workspace's 1.89, so
# this crate (not a core crate) sets its own MSRV and stays out of CI's
# MSRV job (`RUST_MIN_VER_PKGS`).
rust-version = "1.92"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["usd", "mesh", "triangulation", "rendering", "no-std"]
categories = ["graphics", "rendering"]
# Not published while `exedra_triangulate` is a Git dependency, which
# crates.io refuses.
publish = false

[features]
default = ["stage"]
# Reading meshes and implicit shapes off a `layerstack_schemas::Scene`
# (`StageMesh`, `read_shape`). Without it the crate depends on neither
# `layerstack` nor its schemas, as its WebAssembly module is built.
stage = ["dep:layerstack", "dep:layerstack_schemas"]

[dependencies]
# Curve geometry: cubic bases, de Boor, rotation-minimizing frames,
# tubes and ribbons. `no_std` (through `exedra_math`'s `libm` backend),
# depends only on `exedra_math`. Pinned to a commit until it is published.
exedra_curves = { default-features = false, features = ["libm"], git = "https://github.com/forest-rs/exedra", rev = "875e5b0ba52a00f3f1e2d3b963c33aa3bfea2511" }
# Ear clipping of concave faces: deterministic, `no_std`, depends only on
# `exedra_math`. Pinned to `exedra_curves`' commit, so the two share one
# `exedra_math`.
exedra_triangulate = { default-features = false, git = "https://github.com/forest-rs/exedra", rev = "875e5b0ba52a00f3f1e2d3b963c33aa3bfea2511" }
# The vertex split's corner keys.
hashbrown = { workspace = true }
layerstack = { optional = true, workspace = true }
# `usd-shade` for the material bindings a draw list reports, `usd-lux`
# for its lights (and their blackbody colors).
layerstack_schemas = { features = ["usd-geom", "usd-lux", "usd-shade"], optional = true, workspace = true }
# Square roots and the trigonometry of the implicit shapes, in `no_std`;
# `layerstack` already depends on it.
libm = { workspace = true }

[dev-dependencies]
# Tests read their scenes from USDA text.
layerstack_usda = { workspace = true }
# The lights test reads the OpenUSD oracle `layerstack_conformance` records
# (`fixtures/stagehand_lights/oracle.json`); already in the lockfile.
serde_json = { features = ["float_roundtrip"], version = "1.0" }

[lints]
workspace = true
