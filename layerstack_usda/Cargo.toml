[package]
name = "layerstack_usda"
description = "USDA (text format) parser and writer for layerstack — lossless CST, typed AST, error recovery, deterministic serialization."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/layerstack_usda"
keywords = ["usd", "usda", "parser", "scene-description"]
categories = ["parser-implementations"]

[features]
default = []
std = []
# The syntax layers (`lexer`, `cst`, `parser`, `ast`, `lower`, `emit`) as
# public modules, for this repository's tests, benchmarks and fuzzing. They
# follow no semver promise: read layers with `read_usda`.
unstable-internals = []

[dependencies]
# Hash maps for internal indexes; `layerstack` already depends on it.
hashbrown = { workspace = true }
layerstack = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
