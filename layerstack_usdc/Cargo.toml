[package]
name = "layerstack_usdc"
description = "USDC (binary crate format) reader and writer for layerstack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/layerstack_usdc"
keywords = ["usd", "usdc", "binary", "scene-description"]
categories = ["parser-implementations"]

[features]
default = []
std = ["layerstack/std"]
# The crate file's layers (`header`, `toc`, `section`, `value_rep`,
# `value_type`, `compression`, `assemble`) as public modules, for this
# repository's tests, benchmarks and fuzzing. They follow no semver promise.
unstable-internals = []

[dependencies]
# Hash maps for internal indexes; `layerstack` already depends on it.
hashbrown = { workspace = true }
layerstack = { features = ["unstable-internals"], workspace = true }
layerstack_usda = { workspace = true }
lz4_flex = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]
# Tests read the USDA text the writer produces through its syntax layers.
layerstack_usda = { features = ["unstable-internals"], workspace = true }

[lints]
workspace = true
