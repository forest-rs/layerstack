[package]
name = "layerstack_usdz"
description = "USDZ (packaged scene) reader and writer for layerstack."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/layerstack_usdz"
keywords = ["usd", "usdz", "package", "scene-description"]
categories = ["parser-implementations"]

[features]
default = []
std = ["layerstack_usdc/std"]
# The ZIP reader and CRC-32 (`zip`, `crc32`) as public modules, for this
# repository's tests and benchmarks. They follow no semver promise.
unstable-internals = []

[dependencies]
layerstack = { workspace = true }
layerstack_usda = { workspace = true }
layerstack_usdc = { workspace = true }

[dev-dependencies]
# Tests check diagnostics through the USDA syntax layers.
layerstack_usda = { features = ["unstable-internals"], workspace = true }

[lints]
workspace = true
