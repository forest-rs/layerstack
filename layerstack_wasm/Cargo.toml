[package]
name = "layerstack_wasm"
description = "WebAssembly bindings for Layerstack: open, resolve, inspect, explain and edit a stage from JavaScript, with the host supplying asset bytes."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["usd", "wasm", "scene-description", "bindings"]
categories = ["wasm", "api-bindings"]

[lib]
# `cdylib` is the module `@forest-rs/layerstack` loads; `rlib` lets a
# downstream crate link these bindings into a module of its own.
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = [
    "layerstack/std",
    "layerstack_io/std",
    "layerstack_schemas/std",
    "wasm-bindgen/std",
]
# The module `@forest-rs/layerstack` loads, built without `std`: this crate
# supplies the global allocator (dlmalloc, the one `std` uses on
# `wasm32-unknown-unknown`) and a panic handler that traps. `std` on that
# target has no threads, files or clocks, and its panic runtime formats a
# message nothing reads; leaving it out also leaves out the core crates'
# `std` paths (threads, retained USDC arrays), which the bindings never
# take. Only on `wasm32` and without `std`, which brings its own.
standalone = ["dep:dlmalloc"]

[dependencies]
layerstack = { workspace = true }
layerstack_io = { workspace = true }
# Every OpenUSD schema domain, for fallback values and typed prims.
layerstack_schemas = { features = ["all"], workspace = true }
# The JavaScript ABI: the generated glue and `.d.ts` of the exported
# classes. Only this crate depends on it; the CLI that generates the glue
# must be the version `Cargo.lock` holds.
wasm-bindgen = { default-features = false, version = "0.2.129" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The allocator of a `standalone` module: the one `std` itself uses on
# `wasm32-unknown-unknown`, so the module allocates as it did with `std`.
dlmalloc = { features = ["global"], optional = true, version = "0.2.14" }

[dev-dependencies]
# Tests compare a layer's USDA text before an edit and after its undo.
layerstack_usda = { workspace = true }

[lints]
workspace = true
