[package]
name = "opinionated"
description = "Layered sparse opinion resolution over typed addresses."
readme = "README.md"
documentation = "https://docs.rs/opinionated"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["composition", "incremental", "layering", "opinions"]
categories = ["algorithms", "data-structures"]

[lints]
workspace = true

[features]
default = ["hash-tables"]
# Hashes long lists so list-op edits take linear time; without it they scan.
hash-tables = ["dep:hashbrown"]

[dependencies]
hashbrown = { optional = true, workspace = true }
