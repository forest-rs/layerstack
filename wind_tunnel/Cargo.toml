[package]
name = "wind_tunnel"
description = "Criterion benchmarks for the layerstack composition kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["composition", "benchmark", "usd"]
categories = ["development-tools::profiling"]
publish = false

[lints]
workspace = true

[features]
simd = ["layerstack_schemas/simd"]

[dependencies]
layerstack = { workspace = true }

[dev-dependencies]
criterion = { features = ["html_reports"], version = "0.8" }
fearless_simd = { features = ["std"], workspace = true }
glam = { default-features = false, features = ["f64", "libm"], version = "0.33" }
layerstack_schemas = { default-features = false, features = ["usd-geom", "usd-shade", "usd-skel"], workspace = true }
layerstack_usdc = { workspace = true }
opinionated.workspace = true

[[bench]]
name = "arcs"
harness = false

[[bench]]
name = "instancing"
harness = false

[[bench]]
name = "sublayers"
harness = false

[[bench]]
name = "variants"
harness = false

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "usdc_open"
harness = false

[[bench]]
name = "live_edits"
harness = false

[[bench]]
name = "xform_cache"
harness = false

[[bench]]
name = "bounds"
harness = false

[[bench]]
name = "xform_animation"
harness = false

[[bench]]
name = "stage_notices"
harness = false

[[bench]]
name = "query_changes"
harness = false

[[bench]]
name = "retained_queries"
harness = false

[[bench]]
name = "opinionated"
harness = false

[[bench]]
name = "usdc_write"
harness = false

[[bench]]
name = "numeric_arrays"
harness = false

[[bench]]
name = "composition_storage"
harness = false

[[bench]]
name = "skel_deformation"
harness = false
